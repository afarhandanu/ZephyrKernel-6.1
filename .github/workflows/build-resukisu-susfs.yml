name: Build Zephyr Kernel (ReSukiSU + SUSFS)

run-name: Zephyr 6.1 ${{ inputs.source_branch }} / ReSukiSU+SUSFS / LTO=${{ inputs.lto }}

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Kernel source branch
        required: true
        default: android14-6.1-luminaire
        type: choice
        options:
          - android14-6.1-luminaire
          - android14-6.1-staging

      lto:
        description: Link Time Optimization mode
        required: true
        default: none
        type: choice
        options:
          - none
          - thin
          - full

permissions:
  contents: read

concurrency:
  group: zephyr-${{ inputs.source_branch }}-${{ inputs.lto }}-resukisu-susfs
  cancel-in-progress: false

jobs:
  build:
    name: ARM64 GKI / ReSukiSU+SUSFS / ${{ inputs.lto }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      LTO_MODE: ${{ inputs.lto }}

      WORKSPACE_DIR: ${{ github.workspace }}/kernel-workspace
      DIST_DIR: ${{ github.workspace }}/dist
      RELEASE_DIR: ${{ github.workspace }}/release
      AK3_DIR: ${{ github.workspace }}/AnyKernel3
      SUSFS_DIR: ${{ github.workspace }}/susfs4ksu

      # Pin revisions for reproducible builds.
      RESUKISU_COMMIT: 94dd3c93c2053a84fd752df6eb85db99b7d70ab8
      SUSFS_COMMIT: 24743360ea08d98f6ad72b856851abed8de5854f

    steps:
      - name: Show runner resources
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== CPU ==="
          nproc

          echo "=== RAM ==="
          free -h

          echo "=== DISK ==="
          df -h /

      - name: Free disk space
        shell: bash
        run: |
          set -euxo pipefail

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost

          echo "=== DISK AFTER CLEANUP ==="
          df -h /

      - name: Install required packages
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            git \
            patch \
            zip \
            unzip \
            file \
            binutils

      - name: Install repo tool
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" version

      - name: Initialize Android kernel workspace
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$WORKSPACE_DIR"

          cd "$WORKSPACE_DIR"

          "$HOME/bin/repo" init \
            -u https://android.googlesource.com/kernel/manifest \
            -b common-android14-6.1 \
            --depth=1

          "$HOME/bin/repo" sync \
            -c \
            --no-tags \
            --no-clone-bundle \
            -j4

          echo "=== DISK AFTER SYNC ==="
          df -h /

      - name: Switch common source to Zephyr
        shell: bash
        run: |
          set -euxo pipefail

          cd "$WORKSPACE_DIR/common"

          git remote remove zephyr 2>/dev/null || true

          git remote add zephyr \
            "https://github.com/${GITHUB_REPOSITORY}.git"

          git fetch \
            --depth=1 \
            zephyr \
            "$SOURCE_BRANCH"

          git checkout --detach FETCH_HEAD

          SOURCE_SHA="$(git rev-parse HEAD)"
          SOURCE_SUBJECT="$(git log -1 --pretty=%s)"

          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "SOURCE_SUBJECT=$SOURCE_SUBJECT" >> "$GITHUB_ENV"

          echo "=== SOURCE ==="
          echo "Branch  : $SOURCE_BRANCH"
          echo "Commit  : $SOURCE_SHA"
          echo "Subject : $SOURCE_SUBJECT"

          {
            echo "## Zephyr Kernel Build"
            echo ""
            echo "- Source: \`$SOURCE_BRANCH\`"
            echo "- Commit: \`$SOURCE_SHA\`"
            echo "- LTO: \`$LTO_MODE\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Detect kernel version
        shell: bash
        run: |
          set -euxo pipefail

          cd "$WORKSPACE_DIR/common"

          VERSION="$(sed -n 's/^VERSION = //p' Makefile)"
          PATCHLEVEL="$(sed -n 's/^PATCHLEVEL = //p' Makefile)"
          SUBLEVEL="$(sed -n 's/^SUBLEVEL = //p' Makefile)"

          KERNEL_VERSION="${VERSION}.${PATCHLEVEL}.${SUBLEVEL}"

          echo "KERNEL_VERSION=$KERNEL_VERSION" >> "$GITHUB_ENV"

          echo "Kernel version: $KERNEL_VERSION"

      - name: Verify toolchain
        shell: bash
        run: |
          set -euxo pipefail

          cd "$WORKSPACE_DIR"

          test -x tools/bazel
          test -f common/arch/arm64/configs/gki_defconfig
          test -f common/build.config.constants

          CLANG_VERSION="$(
            sed -n 's/^CLANG_VERSION=//p' \
            common/build.config.constants
          )"

          CLANG_BIN="prebuilts/clang/host/linux-x86/clang-${CLANG_VERSION}/bin/clang"

          test -x "$CLANG_BIN"

          echo "CLANG_VERSION=$CLANG_VERSION" >> "$GITHUB_ENV"

          echo "=== CLANG ==="
          "$CLANG_BIN" --version

      - name: Integrate ReSukiSU
        shell: bash
        run: |
          set -euxo pipefail

          cd "$WORKSPACE_DIR"

          curl -LSs \
            "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/${RESUKISU_COMMIT}/kernel/setup.sh" \
            -o /tmp/resukisu-setup.sh

          chmod +x /tmp/resukisu-setup.sh

          /tmp/resukisu-setup.sh "$RESUKISU_COMMIT"

          test -d "$WORKSPACE_DIR/KernelSU"
          test -L "$WORKSPACE_DIR/common/drivers/kernelsu"

          # Bazel's sandbox does not carry KernelSU/.git beside Kbuild.
          # Point KSU_SRC to the checkout so ReSukiSU can read its metadata.
          KSU_KBUILD="$WORKSPACE_DIR/common/drivers/kernelsu/Kbuild"
          test -f "$KSU_KBUILD"
          test -d "$WORKSPACE_DIR/KernelSU/.git"
          grep -F 'KSU_SRC := $(realpath ' "$KSU_KBUILD"

          sed -i \
            "s|^KSU_SRC := .*|KSU_SRC := $WORKSPACE_DIR/KernelSU/kernel|" \
            "$KSU_KBUILD"

          grep -Fx \
            "KSU_SRC := $WORKSPACE_DIR/KernelSU/kernel" \
            "$KSU_KBUILD"

          KSU_SHA="$(
            git -C "$WORKSPACE_DIR/KernelSU" rev-parse HEAD
          )"

          echo "KSU_SHA=$KSU_SHA" >> "$GITHUB_ENV"

          echo "=== RESUKISU ==="
          echo "Commit: $KSU_SHA"

      - name: Fetch SUSFS
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$SUSFS_DIR"

          git init "$SUSFS_DIR"

          git -C "$SUSFS_DIR" remote add origin \
            https://gitlab.com/simonpunk/susfs4ksu.git

          git -C "$SUSFS_DIR" fetch \
            --depth=1 \
            origin \
            "$SUSFS_COMMIT"

          git -C "$SUSFS_DIR" checkout \
            --detach \
            FETCH_HEAD

          SUSFS_SHA="$(
            git -C "$SUSFS_DIR" rev-parse HEAD
          )"

          echo "SUSFS_SHA=$SUSFS_SHA" >> "$GITHUB_ENV"

          echo "=== SUSFS ==="
          echo "Commit: $SUSFS_SHA"

          test "$SUSFS_SHA" = "$SUSFS_COMMIT"

      - name: Apply SUSFS kernel patch
        shell: bash
        run: |
          set -euxo pipefail

          PATCH_FILE="$SUSFS_DIR/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch"
          NAMESPACE_FILE="$WORKSPACE_DIR/common/fs/namespace.c"

          test -f "$PATCH_FILE"
          test -f "$NAMESPACE_FILE"

          echo "=== COPY SUSFS SOURCE ==="

          cp "$SUSFS_DIR"/kernel_patches/fs/* \
            "$WORKSPACE_DIR/common/fs/"

          cp "$SUSFS_DIR"/kernel_patches/include/linux/* \
            "$WORKSPACE_DIR/common/include/linux/"

          test -s "$WORKSPACE_DIR/common/fs/susfs.c"
          test -s "$WORKSPACE_DIR/common/include/linux/susfs.h"
          test -s "$WORKSPACE_DIR/common/include/linux/susfs_def.h"

          cd "$WORKSPACE_DIR/common"

          #
          # Luminaire has one Android-specific trace hook exactly
          # where the SUSFS namespace patch expects upstream context.
          #
          # Remove ONLY this line temporarily, apply SUSFS strictly
          # with fuzz=0, then restore it.
          #

          TRACE_HOOK_PRESENT=0

          if grep -Fxq '#include <trace/hooks/blk.h>' fs/namespace.c; then

            TRACE_HOOK_PRESENT=1

            echo "Luminaire blk trace hook detected."

            sed -i \
              '\|#include <trace/hooks/blk.h>|d' \
              fs/namespace.c

          fi

          echo "=== SUSFS STRICT DRY RUN ==="

          patch \
            --dry-run \
            -p1 \
            -F0 \
            --no-backup-if-mismatch \
            < "$PATCH_FILE"

          echo "=== APPLY SUSFS ==="

          patch \
            -p1 \
            -F0 \
            --no-backup-if-mismatch \
            < "$PATCH_FILE"

          echo "=== RESTORE LUMINAIRE TRACE HOOK ==="

          if [ "$TRACE_HOOK_PRESENT" = "1" ]; then

            sed -i \
              '/#include "internal.h"/a #include <trace/hooks/blk.h>' \
              fs/namespace.c

          fi

          echo "=== VERIFY LUMINAIRE TRACE HOOK ==="

          if [ "$TRACE_HOOK_PRESENT" = "1" ]; then

            grep -Fx \
              '#include <trace/hooks/blk.h>' \
              fs/namespace.c

          fi

          echo "=== VERIFY SUSFS SOURCE ==="

          test -s fs/susfs.c
          test -s include/linux/susfs.h
          test -s include/linux/susfs_def.h

          grep -F \
            '#include <linux/susfs_def.h>' \
            fs/namespace.c

          grep -F \
            'CONFIG_KSU_SUSFS' \
            fs/Makefile

          #
          # Do not verify internal SUSFS variable names here.
          # Internal names can change between SUSFS revisions.
          #
          # The actual features will be verified later against:
          #
          #   1. final embedded kernel .config
          #   2. final compiled Image strings
          #

          echo "=== CHECK REJECTED HUNKS ==="

          if find . -name '*.rej' | grep -q .; then

            echo "SUSFS generated rejected hunks:"

            find . -name '*.rej' -print

            while IFS= read -r rej; do

              echo "================================="
              echo "$rej"
              echo "================================="

              cat "$rej"

            done < <(find . -name '*.rej')

            exit 1

          fi

          echo "=== SUSFS PATCH APPLIED SUCCESSFULLY ==="
          echo "Fuzz level: 0"

      - name: Configure Zephyr and ReSukiSU
        shell: bash
        run: |
          set -euxo pipefail

          FRAGMENT="$WORKSPACE_DIR/common/arch/arm64/configs/zephyr.fragment"

          cat > "$FRAGMENT" <<'EOF'
          CONFIG_LOCALVERSION="-Zephyr"

          CONFIG_KSU=y
          CONFIG_KSU_MULTI_MANAGER_SUPPORT=y
          CONFIG_KSU_SUSFS=y

          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y

          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF

          echo "=== ZEPHYR CONFIG FRAGMENT ==="

          cat "$FRAGMENT"

          #
          # This is intentionally no longer Google's untouched
          # canonical GKI defconfig.
          #

          sed -i \
            's/POST_DEFCONFIG_CMDS="check_defconfig"/POST_DEFCONFIG_CMDS=""/' \
            "$WORKSPACE_DIR/common/build.config.gki"

          #
          # Cosmetic build identity
          #

          cat >> "$WORKSPACE_DIR/common/build.config.common" <<'EOF'

          KBUILD_BUILD_USER=afarhandanu
          KBUILD_BUILD_HOST=ZephyrCI
          EOF

      - name: Prepare release name
        shell: bash
        run: |
          set -euxo pipefail

          case "$LTO_MODE" in

            none)
              LTO_NAME="NoLTO"
              ;;

            thin)
              LTO_NAME="ThinLTO"
              ;;

            full)
              LTO_NAME="FullLTO"
              ;;

            *)
              echo "Unknown LTO mode: $LTO_MODE"
              exit 1
              ;;

          esac

          ZIP_NAME="ZephyrKernel-${KERNEL_VERSION}-RESUKISU+SUSFS-${LTO_NAME}.zip"

          echo "LTO_NAME=$LTO_NAME" >> "$GITHUB_ENV"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

          echo "ZIP: $ZIP_NAME"

      - name: Build ARM64 GKI
        shell: bash
        run: |
          set -euxo pipefail

          cd "$WORKSPACE_DIR"

          rm -rf "$DIST_DIR"

          mkdir -p "$DIST_DIR"

          tools/bazel run \
            --lto="$LTO_MODE" \
            --defconfig_fragment=//common:arch/arm64/configs/zephyr.fragment \
            //common:kernel_aarch64_dist \
            -- \
            --destdir="$DIST_DIR"

          echo "=== BUILD COMPLETE ==="

          test -s "$DIST_DIR/Image"

          ls -lh "$DIST_DIR/Image"

      - name: Extract embedded kernel config
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$RELEASE_DIR"

          python3 <<'PY'
          import gzip
          from pathlib import Path

          image = Path("dist/Image")

          data = image.read_bytes()

          start = data.find(b"IKCFG_ST")

          if start < 0:
              raise SystemExit(
                  "IKCFG_ST not found in kernel Image"
              )

          end = data.find(
              b"IKCFG_ED",
              start + len(b"IKCFG_ST")
          )

          if end < 0:
              raise SystemExit(
                  "IKCFG_ED not found in kernel Image"
              )

          compressed = data[
              start + len(b"IKCFG_ST"):end
          ]

          config = gzip.decompress(
              compressed
          ).decode(
              "utf-8",
              "replace"
          )

          Path(
              "release/kernel.config"
          ).write_text(
              config
          )
          PY

          test -s "$RELEASE_DIR/kernel.config"

      - name: Verify kernel configuration
        shell: bash
        run: |
          set -euxo pipefail

          CONFIG="$RELEASE_DIR/kernel.config"

          REQUIRED=(
            'CONFIG_KSU=y'
            'CONFIG_KSU_MULTI_MANAGER_SUPPORT=y'
            'CONFIG_KSU_SUSFS=y'
            'CONFIG_KSU_SUSFS_SUS_PATH=y'
            'CONFIG_KSU_SUSFS_SUS_MOUNT=y'
            'CONFIG_KSU_SUSFS_SUS_KSTAT=y'
            'CONFIG_KSU_SUSFS_SPOOF_UNAME=y'
            'CONFIG_KSU_SUSFS_ENABLE_LOG=y'
            'CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y'
            'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y'
            'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y'
            'CONFIG_KSU_SUSFS_SUS_MAP=y'
            'CONFIG_CFI_CLANG=y'
          )

          echo "=== VERIFY REQUIRED CONFIG ==="

          for OPTION in "${REQUIRED[@]}"; do

            if ! grep -Fx "$OPTION" "$CONFIG"; then

              echo "Missing required config:"
              echo "$OPTION"

              exit 1

            fi

          done

          echo "=== VERIFY LTO ==="

          case "$LTO_MODE" in

            none)

              grep -Fx \
                'CONFIG_LTO_NONE=y' \
                "$CONFIG"

              ;;

            thin)

              grep -Fx \
                'CONFIG_LTO_CLANG_THIN=y' \
                "$CONFIG"

              ;;

            full)

              grep -Fx \
                'CONFIG_LTO_CLANG_FULL=y' \
                "$CONFIG"

              ;;

          esac

          echo "=== KSU CONFIG ==="

          grep '^CONFIG_KSU' \
            "$CONFIG" \
            || true

          echo "=== LTO CONFIG ==="

          grep '^CONFIG_LTO' \
            "$CONFIG" \
            || true

          echo "=== LOCALVERSION ==="

          grep '^CONFIG_LOCALVERSION' \
            "$CONFIG" \
            || true

      - name: Verify ReSukiSU SUSFS and branding
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== IMAGE INFORMATION ==="

          file "$DIST_DIR/Image"

          ls -lh "$DIST_DIR/Image"

          sha256sum "$DIST_DIR/Image"

          echo "=== KERNEL VERSION ==="

          KERNEL_STRING="$(
            strings "$DIST_DIR/Image" \
              | grep -m1 '^Linux version ' \
              || true
          )"

          echo "$KERNEL_STRING"

          if ! echo "$KERNEL_STRING" | grep -q 'Zephyr'; then

            echo "Zephyr branding not found."

            exit 1

          fi

          echo "=== RESUKISU / KERNELSU SIGNATURE ==="

          if ! strings "$DIST_DIR/Image" \
            | grep -m1 \
              'KernelSU: Initialized with driver version'; then

            echo "ReSukiSU/KernelSU signature not found."

            exit 1

          fi

          echo "=== SUSFS SIGNATURE ==="

          if ! strings "$DIST_DIR/Image" \
            | grep -m1 \
              'susfs is initialized! version'; then

            echo "SUSFS signature not found."

            exit 1

          fi

      - name: Prepare AnyKernel3
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$AK3_DIR"

          git clone \
            https://github.com/osm0sis/AnyKernel3.git \
            "$AK3_DIR"

          cd "$AK3_DIR"

          git checkout \
            020dfeccf9d7e962a48400fc94d3e451df92eead

          rm -rf \
            .git \
            .github \
            modules \
            patch \
            ramdisk

          rm -f \
            README.md \
            LICENSE

          cp "$DIST_DIR/Image" \
            "$AK3_DIR/Image"

          test -s "$AK3_DIR/Image"

      - name: Configure AnyKernel3
        shell: bash
        run: |
          set -euxo pipefail

          cd "$AK3_DIR"

          cat > anykernel.sh <<'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### Zephyr Kernel

          properties() { '
          kernel.string=Zephyr Kernel | ReSukiSU + SUSFS
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          do.check_boot_version=0
          device.name1=
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          block=boot
          is_slot_device=auto
          ramdisk_compression=auto
          patch_vbmeta_flag=auto
          no_magisk_check=1

          . tools/ak3-core.sh

          ui_print " "
          ui_print "================================="
          ui_print "          ZEPHYR KERNEL"
          ui_print "================================="
          ui_print " "
          ui_print "  ReSukiSU + SUSFS"
          ui_print "  Android 14 GKI 6.1"
          ui_print " "

          kernel_version=$(
            cat /proc/version \
              | awk -F '-' '{print $1}' \
              | awk '{print $3}'
          )

          case "$kernel_version" in

            6.1*)

              ui_print "  Current Kernel: $kernel_version"

              ;;

            *)

              abort "  Unsupported Kernel: $kernel_version"

              ;;

          esac

          ui_print " "
          ui_print "  Splitting boot image..."

          split_boot

          if [ -f "$SPLITIMG/ramdisk.cpio" ]; then

            ui_print "  Ramdisk detected."

            unpack_ramdisk

            write_boot

          else

            ui_print "  No ramdisk detected."

            flash_boot

          fi

          ui_print " "
          ui_print "================================="
          ui_print "    Zephyr Kernel Installed"
          ui_print "================================="
          ui_print " "
          EOF

          chmod 755 anykernel.sh

      - name: Build flashable ZIP
        shell: bash
        run: |
          set -euxo pipefail

          cd "$AK3_DIR"

          zip -r9 \
            "$RELEASE_DIR/$ZIP_NAME" \
            . \
            -x "*.git*" \
            -x "*.DS_Store"

          test -s "$RELEASE_DIR/$ZIP_NAME"

      - name: Create build information
        shell: bash
        run: |
          set -euxo pipefail

          {
            echo "ZephyrKernel"
            echo ""
            echo "kernel_version=$KERNEL_VERSION"
            echo "branding=Zephyr"
            echo "root=ReSukiSU"
            echo "susfs=enabled"
            echo "lto=$LTO_MODE"
            echo "clang=$CLANG_VERSION"
            echo ""
            echo "source_branch=$SOURCE_BRANCH"
            echo "source_sha=$SOURCE_SHA"
            echo "source_subject=$SOURCE_SUBJECT"
            echo ""
            echo "resukisu_sha=$KSU_SHA"
            echo "susfs_sha=$SUSFS_SHA"
            echo ""
            echo "github_run=$GITHUB_RUN_NUMBER"
          } > "$RELEASE_DIR/build-info.txt"

          cd "$RELEASE_DIR"

          sha256sum \
            "$ZIP_NAME" \
            > SHA256SUMS.txt

      - name: Verify flashable ZIP
        shell: bash
        run: |
          set -euxo pipefail

          cd "$RELEASE_DIR"

          echo "=== ZIP TEST ==="

          unzip -t "$ZIP_NAME"

          echo "=== ZIP CONTENTS ==="

          unzip -l "$ZIP_NAME"

          echo "=== EXTRACT IMAGE ==="

          unzip -p \
            "$ZIP_NAME" \
            Image \
            > /tmp/Zephyr-Image

          test -s /tmp/Zephyr-Image

          echo "=== RAW IMAGE ==="

          ls -lh /tmp/Zephyr-Image

          file /tmp/Zephyr-Image

          sha256sum /tmp/Zephyr-Image

          echo "=== FLASHABLE ZIP ==="

          ls -lh "$ZIP_NAME"

          sha256sum "$ZIP_NAME"

          {
            echo ""
            echo "## Zephyr Kernel Package"
            echo ""
            echo "- Kernel: \`$KERNEL_VERSION\`"
            echo "- Branding: \`Zephyr\`"
            echo "- Root: \`ReSukiSU\`"
            echo "- SUSFS: \`enabled\`"
            echo "- LTO: \`$LTO_NAME\`"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- ReSukiSU: \`$KSU_SHA\`"
            echo "- SUSFS: \`$SUSFS_SHA\`"
            echo "- ZIP: \`$ZIP_NAME\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show disk usage
        if: always()
        shell: bash
        run: |
          echo "=== FINAL DISK USAGE ==="

          df -h /

      - name: Upload flashable kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ZephyrKernel-ReSukiSU-SUSFS-${{ inputs.lto }}-run${{ github.run_number }}
          path: |
            release/*.zip
            release/build-info.txt
            release/SHA256SUMS.txt
            release/kernel.config
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
